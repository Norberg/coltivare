<?xml version="1.0"?>
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family><family>FreeSans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family><family>FreeSerif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>FreeMono</family></prefer></alias>
</fontconfig>
